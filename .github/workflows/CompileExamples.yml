name: Compile examples

permissions:
  contents: read

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - ".github/workflows/CompileExamples.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - ".github/workflows/CompileExamples.yml"
  schedule:
    - cron: "0 0 1 * *"

  workflow_dispatch:
  repository_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boards:
    name: "Compile for ${{ matrix.config.board }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - board: "Arduino Uno"
            fqbn: "arduino:avr:uno"
            platform: "arduino:avr@1.8.8"
          - board: "Arduino Leonardo"
            fqbn: "arduino:avr:leonardo"
            platform: "arduino:avr@1.8.8"
          - board: "Arduino Mega2560"
            fqbn: "arduino:avr:mega"
            platform: "arduino:avr@1.8.8"
          - board: "Arduino Due"
            fqbn: "arduino:sam:arduino_due_x"
            platform: "arduino:sam@1.6.12"
          - board: "ESP32 NodeMCU-32S"
            fqbn: "esp32:esp32:nodemcu-32s"
            platform: "esp32:esp32@3.3.11"
            additional-url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install checksum-verified Arduino CLI
        env:
          ARDUINO_CLI_VERSION: "1.5.1"
          ARDUINO_CLI_SHA256: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"
        run: |
          set -euo pipefail
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          install_dir="$RUNNER_TEMP/arduino-cli"
          curl --fail --location --retry 3 \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ARDUINO_CLI_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" arduino-cli
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install platform ${{ matrix.config.platform }}
        env:
          ADDITIONAL_URL: ${{ matrix.config.additional-url }}
          PLATFORM: ${{ matrix.config.platform }}
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          if [[ -n "${ADDITIONAL_URL:-}" ]]; then
            arduino-cli config add board_manager.additional_urls "$ADDITIONAL_URL"
          fi
          arduino-cli core update-index
          arduino-cli core install "$PLATFORM" --run-post-install

      - name: Install Arduino libraries
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "Ethernet@2.0.2"
          arduino-cli lib install "LoRa@0.8.0"

      - name: Compile examples for ${{ matrix.config.board }}
        env:
          FQBN: ${{ matrix.config.fqbn }}
        run: |
          set -euo pipefail
          errors=()
          while IFS= read -r -d '' sketch_path; do
            if grep -qE 'WiFi|ETH' "$sketch_path" && [[ "$FQBN" != esp* ]]; then
              echo "Skip $sketch_path for $FQBN"
              continue
            fi

            args=(arduino-cli compile --fqbn "$FQBN" --warnings all
                  --library "$GITHUB_WORKSPACE")
            if grep -q 'STD_FUNCTION_MIDDLEWARE' "$sketch_path"; then
              args+=(--build-property "build.extra_flags=-DSTD_FUNCTION_MIDDLEWARE")
            fi

            echo "Compile $sketch_path for $FQBN"
            if ! "${args[@]}" "$sketch_path"; then
              errors+=("$sketch_path")
            fi
          done < <(find ./examples -name '*.ino' -print0)

          if (( ${#errors[@]} != 0 )); then
            printf 'Failed example: %s\n' "${errors[@]}" >&2
            exit 1
          fi
