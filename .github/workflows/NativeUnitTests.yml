name: Unit Tests

permissions:
  contents: read

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/NativeUnitTests.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/NativeUnitTests.yml"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
  repository_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build for ${{ matrix.config.name }}"
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 10
    env:
      BUILD_DIR: ${{ github.workspace }}/test/build
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Linux x86_64"
            os: "ubuntu-24.04"
          - name: "macOS Universal"
            os: "macos-14"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Create Build Environment
        run: cmake -E make_directory ${{ env.BUILD_DIR }}
      - name: Running CMake
        working-directory: ${{ env.BUILD_DIR }}
        run: cmake ..
      - name: Build Unit Tests
        working-directory: ${{ env.BUILD_DIR }}
        run: cmake --build .
      - name: Run Unit Tests
        if: ${{ success() }}
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure

  coverage:
    name: "Coverage (minimum 90% lines)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"
      - name: Install pinned coverage tool
        run: python -m pip install --disable-pip-version-check gcovr==8.6
      - name: Configure coverage build
        run: cmake -S test -B test/coverage -DENABLE_COVERAGE=ON
      - name: Build coverage tests
        run: cmake --build test/coverage --parallel 4
      - name: Run coverage tests
        run: ctest --test-dir test/coverage --output-on-failure
      - name: Enforce full-library line coverage
        run: >-
          gcovr --root . --filter 'src/' --object-directory test/coverage
          --merge-mode-functions=merge-use-line-min
          --txt-metric branch --print-summary --xml coverage.xml
          --html-details coverage.html
          --fail-under-line 90 --fail-under-branch 85

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aWOT-coverage
          path: |
            coverage.xml
            coverage.html
            coverage.*.html
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: "Address/undefined-behavior sanitizers"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Configure sanitizer build
        run: cmake -S test -B test/sanitizers -DENABLE_SANITIZERS=ON
      - name: Build sanitizer tests
        run: cmake --build test/sanitizers --parallel 4
      - name: Run sanitizer tests
        run: ctest --test-dir test/sanitizers --output-on-failure

  fuzz:
    name: "HTTP parser fuzz smoke test"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify the pinned runner compiler
        run: |
          clang-18 --version | tee /dev/stderr | grep -F "clang version 18.1.3"
          llvm-symbolizer-18 --version | tee /dev/stderr | grep -F "LLVM version 18.1.3"
      - name: Configure libFuzzer build
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S test -B test/fuzz-build -DENABLE_FUZZING=ON
      - name: Build request fuzzer
        run: cmake --build test/fuzz-build --target aWOT-request-fuzzer --parallel 4
      - name: Run seed corpus and coverage-guided fuzzing
        run: |
          mkdir -p test/fuzz/artifacts
          cp -R test/fuzz/corpus "$RUNNER_TEMP/aWOT-fuzz-corpus"
          test/fuzz-build/aWOT-request-fuzzer \
            -max_total_time=60 -timeout=2 -rss_limit_mb=2048 \
            -artifact_prefix=test/fuzz/artifacts/ "$RUNNER_TEMP/aWOT-fuzz-corpus"
      - name: Upload reproducer on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awot-fuzz-reproducer
          path: test/fuzz/artifacts/
          if-no-files-found: ignore
